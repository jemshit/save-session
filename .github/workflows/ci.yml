name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # The Windows job is the point of this matrix: the repo's OS-neutrality rules exist
    # because macOS-only assumptions shipped three times. Reasoning is not evidence.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Linux job scans every commit for leaked paths and session ids. A shallow
          # checkout makes "--history" inspect only the tip while claiming full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Invariants (no personal data, dev notes, encodings, wrappers, frontmatter)
        run: python tools/check_invariants.py

      - name: Release tag matches the declared version and commit
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_invariants.py --release

      - name: History invariants (personal data that survived in older commits)
        if: runner.os == 'Linux'  # history is identical on every runner
        run: python tools/check_invariants.py --history

      - name: Unit tests (platform-sensitive paths)
        run: |
          python tools/test_platform_helpers.py
          python tools/test_detectors.py
          python tools/test_save_session.py

      - name: Drift check (SKILL.md <-> decision-flow.md)
        working-directory: skills/save-session
        run: python scripts/check_flow_doc.py

      - name: Detectors honour their output contract on this OS
        # Previously this step ran the detectors with `|| true` and discarded their output, so
        # a traceback or a missing ok/reason could not fail the build.
        run: python tools/check_detector_output.py

  installs:
    # End-to-end check that the real installer can parse the skill. An unquoted colon in the
    # frontmatter description would make this skip the file while the listing still renders.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The skills CLI finds and parses the skill
        env:
          NO_COLOR: "1"
        run: |
          # Strip ANSI escapes too: the CLI colors its output and a plain grep would miss it.
          out=$(npx --yes skills add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "$out"
          echo "$out" | grep -q "Found 1 skill"
          echo "$out" | grep -q "save-session"

      - name: Claude Code plugin and marketplace manifests validate strictly
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate --strict .
